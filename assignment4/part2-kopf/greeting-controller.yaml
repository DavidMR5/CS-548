apiVersion: v1
kind: ServiceAccount
metadata:
  name: greeting-controller-sa
  namespace: default

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: greeting-controller-role

rules:
  - apiGroups: ["hy548.csd.uoc.gr"]
    resources: ["greetings", "greetings/status"]
    verbs: ["get", "list", "watch", "patch", "update"]

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "delete", "update"]

  - apiGroups: [""]
    resources: ["services", "events"]
    verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]

  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]


  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*"]
    verbs: ["get"]
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: greeting-controller-binding

subjects:
  - kind: ServiceAccount
    name: greeting-controller-sa
    namespace: default

roleRef:
  kind: ClusterRole
  name: greeting-controller-role
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: greeting-controller

spec:
  replicas: 1

  selector:
    matchLabels:
      app: greeting-controller

  template:
    metadata:
      labels:
        app: greeting-controller

    spec:
      serviceAccountName: greeting-controller-sa

      containers:
        - name: controller
          image: davidmr4/greeting-controller:v5
          imagePullPolicy: Never