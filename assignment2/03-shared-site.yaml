apiVersion: v1
kind: ConfigMap
metadata:
  name: download-script
data:
  download.sh: |
    #!/bin/bash
    set -e

    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y wget ca-certificates
    rm -rf /var/lib/apt/lists/*

    mkdir -p /site
    rm -rf /site/*
    cd /site

    wget -E -k -p https://www.csd.uoc.gr/
---
apiVersion: batch/v1
kind: Job
metadata:
  name: csd-download-job
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: downloader
          image: ubuntu:24.04
          command: ["/bin/bash", "/scripts/download.sh"]
          volumeMounts:
            - name: script-volume
              mountPath: /scripts
            - name: site-volume
              mountPath: /site
      volumes:
        - name: script-volume
          configMap:
            name: download-script
            defaultMode: 0755
        - name: site-volume
          hostPath:
            path: /data/csd-site
            type: DirectoryOrCreate
  backoffLimit: 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: csd-refresh
spec:
  schedule: "15 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: downloader
              image: ubuntu:24.04
              command: ["/bin/bash", "/scripts/download.sh"]
              volumeMounts:
                - name: script-volume
                  mountPath: /scripts
                - name: site-volume
                  mountPath: /site
          volumes:
            - name: script-volume
              configMap:
                name: download-script
                defaultMode: 0755
            - name: site-volume
              hostPath:
                path: /data/csd-site
                type: DirectoryOrCreate
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-site-pod
spec:
  containers:
    - name: nginx
      image: nginx:1.29.5-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: site-volume
          mountPath: /usr/share/nginx/html
  volumes:
    - name: site-volume
      hostPath:
        path: /data/csd-site
        type: DirectoryOrCreate