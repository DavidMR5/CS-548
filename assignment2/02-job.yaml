apiVersion: v1
kind: ConfigMap
metadata:
  name: download-script
data:
  download.sh: |
    #!/bin/bash
    set -e

    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y wget ca-certificates
    rm -rf /var/lib/apt/lists/*

    mkdir -p /site
    cd /site

    wget -E -k -p https://www.csd.uoc.gr/
---
apiVersion: batch/v1
kind: Job
metadata:
  name: csd-download-job
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: downloader
          image: ubuntu:24.04
          command: ["/bin/bash", "/scripts/download.sh"]
          volumeMounts:
            - name: script-volume
              mountPath: /scripts
            - name: site-volume
              mountPath: /site
      volumes:
        - name: script-volume
          configMap:
            name: download-script
            defaultMode: 0755
        - name: site-volume
          emptyDir: {}
  backoffLimit: 1