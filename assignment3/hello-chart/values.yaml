replicaCount: 1

image:
  repository: carvicsforth/hello-kubernetes
  tag: "1.10"
  pullPolicy: IfNotPresent

service:
  port: 8080

ingress:
  enabled: true
  className: nginx
  path: /hello
  pathType: Prefix

message: "Hello world!"

resources: {}


autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80